name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      # The project's central claim is that a report re-derives byte-identical
      # from its own event store with no model call. Asserting it in CI, on
      # every supported Python and both operating systems, is the difference
      # between a claim and a check.
      - name: Replay is byte-identical (Claude Code trace)
        run: blackbox tests/fixtures/synthetic.jsonl --quiet --verify

      - name: Replay is byte-identical (Codex trace)
        run: blackbox tests/fixtures/codex.jsonl --quiet --verify

      - name: Reports render
        run: |
          blackbox tests/fixtures/synthetic.jsonl --quiet --html /tmp/report.html --json /tmp/payload.json
          python -c "import json,sys; d=json.load(open('/tmp/payload.json')); sys.exit(0 if d['findings'] else 1)"

  build:
    name: package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel and run it
        run: |
          pip install dist/*.whl
          blackbox --version
          blackbox tests/fixtures/codex.jsonl --quiet --verify
